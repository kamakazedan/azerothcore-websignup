<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A split crystal">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9dcf0"/>
      <stop offset=".5" stop-color="#6d8bb0"/>
      <stop offset="1" stop-color="#2c4466"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".4" r=".55">
      <stop offset="0" stop-color="#3a72b0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#050a14" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-20%" width="260%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#050a14" stroke="url(#ring)" stroke-width="2"/>
  <circle cx="32" cy="32" r="25.5" fill="url(#core)" stroke="#9fb8d4" stroke-opacity=".22"/>
  <!-- a cut crystal: four facets, lit from the upper right -->
  <path d="M32 8 21 25 31.4 27.5Z" fill="#45678f"/>
  <path d="M21 25 32 57 31.4 27.5Z" fill="#1e3452"/>
  <path d="M32 8 43 25 32.6 27.5Z" fill="#a9c9ea"/>
  <path d="M43 25 32 57 32.6 27.5Z" fill="#5d86b5"/>
  <path d="M32 8 43 25 32 57 21 25Z" fill="none" stroke="#d9eaf9" stroke-width=".9" stroke-linejoin="round" opacity=".75"/>
  <!-- and a fracture of light down its middle -->
  <path d="M32 8 31.2 17 32.9 24 31.3 33 32.7 41 31.6 49 32 57" fill="none" stroke="#9fdcff" stroke-width="3.2" filter="url(#glow)"/>
  <path d="M32 8 31.2 17 32.9 24 31.3 33 32.7 41 31.6 49 32 57" fill="none" stroke="#f2fbff" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
